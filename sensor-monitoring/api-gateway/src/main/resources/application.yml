server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Every downstream route the gateway is allowed to proxy to.
      # Clients only ever talk to this service - auth-service,
      # device-service and sensor-service are not published outside
      # the docker network anymore (see docker-compose.yml).
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: device-service
          uri: ${DEVICE_SERVICE_URL:http://device-service:8082}
          predicates:
            - Path=/api/v1/devices/**

        - id: sensor-service
          uri: ${SENSOR_SERVICE_URL:http://sensor-service:8083}
          predicates:
            - Path=/api/v1/sensors/**

      httpclient:
        connect-timeout: 3000
        response-timeout: 8s

      # Forward the real client IP to downstream services via
      # X-Forwarded-For so their existing per-IP RateLimitingFilter
      # keeps working correctly behind the proxy.
      x-forwarded:
        enabled: true
        for-enabled: true
        proto-enabled: true
        host-enabled: true

# Must be identical to the secret used by auth-service to sign tokens,
# and by device-service / sensor-service to verify them.
jwt:
  secret: ${JWT_SECRET:ThisIsADemoSecretKeyForPOC_PleaseChangeInProd_1234567890}

# Paths the JwtAuthenticationFilter lets through without a token.
# Everything else (devices, sensors, ...) requires "Authorization: Bearer <token>".
gateway:
  security:
    public-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /actuator/health/**
      - /actuator/prometheus

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.manikanta: DEBUG
    org.springframework.cloud.gateway: INFO