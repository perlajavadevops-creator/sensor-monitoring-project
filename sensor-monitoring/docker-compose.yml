services:

  postgres:
    image: postgres:16-alpine
    container_name: sensor-postgres
    environment:
      POSTGRES_DB: sensordb
      POSTGRES_USER: sensoruser
      POSTGRES_PASSWORD: sensorpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensoruser -d sensordb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sensor-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sensor-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L6_S9D6T3mc-p7C79_C-A"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensor-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sensor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - sensor-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ThisIsADemoSecretKeyForPOC_PleaseChangeInProd_1234567890
    networks:
      - sensor-net

  device-service:
    build:
      context: .
      dockerfile: device-service/Dockerfile
    container_name: device-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USERNAME: sensoruser
      DB_PASSWORD: sensorpass
      JWT_SECRET: ThisIsADemoSecretKeyForPOC_PleaseChangeInProd_1234567890
    networks:
      - sensor-net

  sensor-service:
    build:
      context: .
      dockerfile: sensor-service/Dockerfile
    container_name: sensor-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      device-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sensordb
      DB_USERNAME: sensoruser
      DB_PASSWORD: sensorpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ThisIsADemoSecretKeyForPOC_PleaseChangeInProd_1234567890
      SENSOR_INTERVAL_MS: 10000
      DEVICE_SERVICE_URL: http://device-service:8082
    networks:
      - sensor-net

volumes:
  postgres_data:

networks:
  sensor-net:
    driver: bridge